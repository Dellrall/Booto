name: Booto CI - Multi-Compiler Matrix, Sanitizers & Coverage

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libncurses-dev libblkid-dev libudev-dev

      - name: Build with Makefile (${{ matrix.compiler }})
        env:
          CC: ${{ matrix.compiler }}
        run: make CC=${{ matrix.compiler }} all

      - name: Run Unit Tests (${{ matrix.compiler }})
        run: make CC=${{ matrix.compiler }} test

      - name: Test CLI Flags
        run: |
          ./bin/booto --version
          ./bin/booto --help
          ./bin/booto --dry-run -V

  sanitizers-and-fuzzing:
    name: AddressSanitizer & Mutation Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libncurses-dev libblkid-dev libudev-dev

      - name: Run ASan & UBSan Test Suite
        run: make asan

      - name: Run Mutation Fuzzing Harness
        run: make fuzz

  code-coverage:
    name: Code Coverage (gcov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lcov libncurses-dev libblkid-dev libudev-dev

      - name: Run Coverage Evaluation
        run: make coverage

  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Analysis Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck libncurses-dev libblkid-dev

      - name: Generate Version Header
        run: make version

      - name: Run cppcheck
        run: |
          cppcheck --std=c11 \
                   --enable=warning,performance,portability \
                   --inline-suppr \
                   --suppress=missingInclude \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --suppress=unmatchedSuppression \
                   --error-exitcode=1 \
                   -I include \
                   src/

  memory-safety:
    name: Memory Leak Validation (Valgrind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind libncurses-dev libblkid-dev

      - name: Build Project
        run: make all

      - name: Run Valgrind on Dry-Run Mode
        run: |
          valgrind --leak-check=full \
                   --show-leak-kinds=all \
                   --error-exitcode=1 \
                   --track-origins=yes \
                   ./bin/booto --dry-run
