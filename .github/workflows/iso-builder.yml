name: Booto Live ISO Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-live-iso:
    name: Compile Debian Live ISO & Publish
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip iso]') && !contains(github.event.head_commit.message, '[no iso]') && !contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      discussions: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install ISO Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            mtools \
            dosfstools \
            libncurses-dev \
            libblkid-dev \
            libudev-dev

      - name: Build Standalone Debian Live ISO
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            ISO_NAME="booto-${TAG}-amd64.iso"
          else
            ISO_NAME="booto-live-amd64.iso"
          fi
          echo "Building ISO with filename: ${ISO_NAME}"
          sudo ./scripts/build_iso.sh "${ISO_NAME}"

      - name: Upload ISO Artifact (Test Builds Only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: booto-live-amd64-iso
          path: |
            dist/*.iso
            dist/*.sha256
          retention-days: 1

      - name: Extract Changelog Section
        id: extract_changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "Extracting release notes for version: $VER"
          python3 -c "
          import re
          ver = '$VER'
          try:
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
              pattern = r'## \[' + re.escape(ver) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
                  notes = re.sub(r'\n---\s*$', '', notes).strip()
              else:
                  notes = '### Booto Release ' + ver + '\n\nStandalone Amnesic Live OS for Offline Forensic Rootkit & Bootkit Detection.'
          except Exception as e:
              notes = '### Booto Release ' + ver + '\n\nStandalone Amnesic Live OS for Offline Forensic Rootkit & Bootkit Detection.'
          with open('release_notes.md', 'w') as out:
              out.write(notes)
          "
          cat release_notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: release_notes.md
          files: |
            dist/*.iso
            dist/*.sha256
          draft: false
          prerelease: false
