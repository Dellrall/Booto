name: Booto Live ISO Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-live-iso:
    name: Compile Debian Live ISO & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ISO Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            mtools \
            dosfstools \
            libncurses-dev \
            libblkid-dev \
            libudev-dev

      - name: Build Standalone Debian Live ISO
        run: |
          sudo ./scripts/build_iso.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: booto-live-amd64-iso
          path: |
            dist/booto-live-amd64.iso
            dist/booto-live-amd64.iso.sha256
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/booto-live-amd64.iso
            dist/booto-live-amd64.iso.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
