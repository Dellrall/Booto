name: Booto Live ISO Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-live-iso:
    name: Compile Debian Live ISO & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ISO Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            mtools \
            dosfstools \
            libncurses-dev \
            libblkid-dev \
            libudev-dev

      - name: Build Standalone Debian Live ISO
        run: |
          sudo ./scripts/build_iso.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: booto-live-amd64-iso
          path: |
            dist/booto-live-amd64.iso
            dist/booto-live-amd64.iso.sha256
          retention-days: 14

      - name: Extract Changelog Section
        id: extract_changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "Extracting release notes for version: $VER"
          python3 -c "
          import re
          ver = '$VER'
          try:
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
              pattern = r'## \[' + re.escape(ver) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
                  # Remove trailing separator if present
                  notes = re.sub(r'\n---\s*$', '', notes).strip()
              else:
                  notes = '### Booto Release ' + ver + '\n\nStandalone Amnesic Live OS for Offline Forensic Rootkit & Bootkit Detection.'
          except Exception as e:
              notes = '### Booto Release ' + ver + '\n\nStandalone Amnesic Live OS for Offline Forensic Rootkit & Bootkit Detection.'
          with open('release_notes.md', 'w') as out:
              out.write(notes)
          "
          cat release_notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: release_notes.md
          files: |
            dist/booto-live-amd64.iso
            dist/booto-live-amd64.iso.sha256
          draft: false
          prerelease: false
